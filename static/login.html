<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voy Pa' Ya - Acceso</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f1f5f9; color: #1e293b; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }

        .app-container {
            width: 100%; max-width: 414px; background: #ffffff;
            border-radius: 28px; box-shadow: 0 10px 35px rgba(0,0,0,0.12);
            border: 2px solid #1e3a8a; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px;
        }

        /* Encabezado Logo Oficial Restaurado */
        .brand-header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 2px; }
        .logo-svg { width: 60px; height: 60px; filter: drop-shadow(0px 4px 8px rgba(255, 85, 0, 0.3)); }
        .brand-title { font-size: 22px; font-weight: 800; color: #1e3a8a; line-height: 1; }
        .brand-subtitle { font-size: 11px; font-weight: 800; color: #ff5500; letter-spacing: 1.5px; }

        /* Selector de Rol Pasajero / Chófer */
        .role-selector { display: flex; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 14px; padding: 4px; gap: 4px; }
        .role-btn { flex: 1; padding: 10px; border: none; background: transparent; border-radius: 10px; font-weight: 800; font-size: 12px; color: #64748b; cursor: pointer; transition: all 0.2s; }
        .role-btn.active { background: #1e3a8a; color: #ffffff; box-shadow: 0 2px 8px rgba(30, 58, 138, 0.25); }

        /* Tabs Iniciar Sesión / Registro */
        .auth-tabs { display: flex; border-bottom: 2px solid #e2e8f0; }
        .tab-btn { flex: 1; text-align: center; padding: 8px; font-weight: 800; font-size: 13px; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tab-btn.active { color: #ff5500; border-color: #ff5500; }

        /* Formulario Inputs */
        .form-box { display: flex; flex-direction: column; gap: 10px; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 11px; font-weight: 700; color: #64748b; }
        .input-group input, .input-group select {
            width: 100%; background: #f8fafc; border: 1px solid #cbd5e1;
            border-radius: 12px; padding: 11px 14px; color: #1e3a8a; font-weight: 700; font-size: 13px; outline: none;
        }

        /* Botón Ingresar */
        .btn-submit {
            background: linear-gradient(135deg, #ff5500, #ff7700); color: #ffffff; border: none;
            padding: 15px; border-radius: 16px; font-weight: 800; font-size: 15px; width: 100%;
            cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(255, 85, 0, 0.3); margin-top: 4px;
        }

        .divider { display: flex; align-items: center; text-align: center; color: #94a3b8; font-size: 11px; font-weight: 700; margin: 2px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e2e8f0; }
        .divider span { padding: 0 10px; }

        /* Botón Social */
        .social-buttons { display: flex; flex-direction: column; gap: 10px; }
        .btn-social {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 14px; padding: 12px;
            font-weight: 700; font-size: 13px; color: #1e293b; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .btn-social:hover { border-color: #1e3a8a; background: #f8fafc; }
        .btn-social svg { width: 20px; height: 20px; }

        .footer-note { font-size: 10px; color: #64748b; text-align: center; font-weight: 600; margin-top: 2px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="brand-header">
        <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="100" rx="25" fill="#1E3A8A"/>
            <path d="M25 30L50 80L75 30H60L50 55L40 30H25Z" fill="#FF5500"/>
            <circle cx="50" cy="25" r="8" fill="#FF5500"/>
        </svg>
        <div>
            <div class="brand-title">VOY PA' YA</div>
            <div class="brand-subtitle">TRANSPORTE Y ENTREGAS</div>
        </div>
    </div>

    <div class="role-selector">
        <button class="role-btn active" id="btnRolePasajero" onclick="setRol('pasajero')">👤 Soy Pasajero</button>
        <button class="role-btn" id="btnRoleChofer" onclick="setRol('chofer')">🛵 Soy Chófer</button>
    </div>

    <div class="auth-tabs">
        <div class="tab-btn active" id="tabLogin" onclick="setTab('login')">Iniciar Sesión</div>
        <div class="tab-btn" id="tabRegistro" onclick="setTab('registro')">Crear Cuenta</div>
    </div>

    <div class="form-box" id="formContainer"></div>

    <button class="btn-submit" onclick="procesarAcceso()">Ingresar a la App</button>

    <div class="divider"><span>o también puedes</span></div>

    <div class="social-buttons">
        <button class="btn-social" onclick="registroGoogle()">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Continuar con Google</span>
        </button>
    </div>

    <p class="footer-note">Al continuar, aceptas nuestros Términos de Servicio y Políticas de Privacidad.</p>
</div>

<script>
    let rolActual = 'pasajero';
    let tabActual = 'login';

    function setRol(rol) {
        rolActual = rol;
        document.getElementById('btnRolePasajero').className = `role-btn ${rol === 'pasajero' ? 'active' : ''}`;
        document.getElementById('btnRoleChofer').className = `role-btn ${rol === 'chofer' ? 'active' : ''}`;
        renderFormulario();
    }

    function setTab(tab) {
        tabActual = tab;
        document.getElementById('tabLogin').className = `tab-btn ${tab === 'login' ? 'active' : ''}`;
        document.getElementById('tabRegistro').className = `tab-btn ${tab === 'registro' ? 'active' : ''}`;
        renderFormulario();
    }

    function renderFormulario() {
        const container = document.getElementById('formContainer');
        container.innerHTML = '';

        if (tabActual === 'login') {
            container.innerHTML = `
                <div class="input-group">
                    <label>Teléfono o Correo Electrónico:</label>
                    <input type="text" id="inputLoginUser" placeholder="Ej: 04120000000 o correo@email.com" value="0412-0000000">
                </div>
                <div class="input-group">
                    <label>Contraseña:</label>
                    <input type="password" id="inputLoginPass" placeholder="••••••••" value="123456">
                </div>
            `;
        } else {
            let camposEspecificos = '';
            if (rolActual === 'chofer') {
                camposEspecificos = `
                    <div class="input-group">
                        <label>Cédula / RIF:</label>
                        <input type="text" id="inputCedula" placeholder="Ej: V-12345678">
                    </div>
                    <div class="input-group">
                        <label>Tipo de Vehículo:</label>
                        <select id="selectVehiculo">
                            <option value="moto">🛵 Moto (Bera, Empire, etc.)</option>
                            <option value="carro">🚗 Carro Particular</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Modelo y Placa del Vehículo:</label>
                        <input type="text" id="inputPlaca" placeholder="Ej: Bera SBR Azul - Placa ABC123">
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="input-group">
                    <label>Nombre y Apellido:</label>
                    <input type="text" id="inputNombre" placeholder="Ej: Ángel Tribiño" value="Ángel Tribiño">
                </div>
                <div class="input-group">
                    <label>Número de Teléfono:</label>
                    <input type="text" id="inputTelefono" placeholder="Ej: 0412-1234567">
                </div>
                <div class="input-group">
                    <label>Correo Electrónico:</label>
                    <input type="email" id="inputEmail" placeholder="correo@ejemplo.com">
                </div>
                ${camposEspecificos}
                <div class="input-group">
                    <label>Crear Contraseña:</label>
                    <input type="password" id="inputPass" placeholder="••••••••">
                </div>
            `;
        }
    }

    function registroGoogle() {
        let telf = prompt("¡Cuenta de Google Vinculada!\nPara completar tu perfil de Voy Pa' Ya, ingresa tu número de teléfono de contacto (Ej: 0412-0000000):");
        if (telf) {
            localStorage.setItem('user_nombre', 'Ángel Tribiño');
            localStorage.setItem('user_telefono', telf);
            alert("¡Registro exitoso con Google! Redirigiendo a la aplicación...");
            window.location.href = (rolActual === 'pasajero') ? '/' : '/conductor';
        }
    }

    function procesarAcceso() {
        if (tabActual === 'login') {
            let user = document.getElementById('inputLoginUser').value;
            if (!user) { alert("Ingresa tu teléfono o correo."); return; }
        } else {
            let nombre = document.getElementById('inputNombre').value;
            if (!nombre) { alert("Por favor ingresa tu nombre."); return; }
            localStorage.setItem('user_nombre', nombre);
        }

        if (rolActual === 'pasajero') {
            window.location.href = '/';
        } else {
            window.location.href = '/conductor';
        }
    }

    renderFormulario();
</script>
</body>
</html>
