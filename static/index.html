<!-- Leaflet JS para hacer funcionar el mapa -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializar el mapa
        var map = L.map('map').setView([9.2000, -66.5833], 15);

        // Cargar diseño del mapa
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var marcadorPasajero = null;

        // Función para obtener la ubicación exacta del pasajero
        function obtenerUbicacionExacta() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;

                    // Centrar el mapa en la ubicación real del usuario
                    map.setView([lat, lng], 16);

                    // Si ya hay un marcador anterior, lo movemos; si no, lo creamos
                    if (marcadorPasajero) {
                        marcadorPasajero.setLatLng([lat, lng]);
                    } else {
                        marcadorPasajero = L.marker([lat, lng]).addTo(map)
                            .bindPopup("¡Estás aquí, mi amor!").openPopup();
                    }

                    // Opcional: rellenar automáticamente el campo de origen
                    document.getElementById('origen').value = "Mi ubicación actual";

                }, function(error) {
                    console.error("No se pudo obtener la ubicación: ", error);
                    alert("Por favor, activa los permisos de ubicación en tu dispositivo.");
                }, {
                    enableHighAccuracy: true
                });
            } else {
                alert("Tu navegador no soporta geolocalización.");
            }
        }

        // Llamar a la función apenas cargue la página
        window.onload = function() {
            obtenerUbicacionExacta();
        };

        function pedirCarrera() {
            const origen = document.getElementById('origen').value;
            const destino = document.getElementById('destino').value;
            
            if(!origen || !destino) {
                alert("Por favor, completa el origen y el destino.");
                return;
            }
            
            alert("¡Buscando conductor cercano para tu viaje desde " + origen + " hasta " + destino + "!");
        }
    </script>
